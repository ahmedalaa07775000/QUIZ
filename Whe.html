        /* ================= SOUND SYSTEM ================= */
        const SoundSystem = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') this.ctx.resume();
            },
            playClick() {
                this.init();
                const t = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(420, t);
                osc.frequency.exponentialRampToValueAtTime(220, t + 0.08);
                gain.gain.setValueAtTime(0.07, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
                osc.start(t); osc.stop(t + 0.12);
            },
            playTick() {
                if (!this.ctx) return;
                const t = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.type = 'square';
                osc.frequency.setValueAtTime(950, t);
                gain.gain.setValueAtTime(0.055, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
                osc.start(t); osc.stop(t + 0.05);
            },
            playSpinTicks(durationMs, segCount) {
                const tickCount = Math.min(55, Math.max(24, segCount * 3));
                for (let i = 0; i <= tickCount; i++) {
                    const progress = i / tickCount;
                    const eased = 1 - Math.pow(1 - progress, 3);
                    const time = eased * durationMs;
                    setTimeout(() => this.playTick(), time);
                }
            },
            playWhoosh(durationMs) {
                if (!this.ctx) return;
                const t = this.ctx.currentTime;
                const dur = durationMs / 1000;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, t);
                osc.frequency.exponentialRampToValueAtTime(35, t + dur);
                gain.gain.setValueAtTime(0.025, t);
                gain.gain.linearRampToValueAtTime(0.0001, t + dur);
                osc.start(t); osc.stop(t + dur + 0.1);
            },
            playReveal() {
                this.init();
                [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
                    const t = this.ctx.currentTime + i * 0.11;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, t);
                    gain.gain.setValueAtTime(0.0001, t);
                    gain.gain.linearRampToValueAtTime(0.13, t + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
                    osc.start(t); osc.stop(t + 0.45);
                });
            }
        };

        /* ================= SPIN WHEEL ================= */
        const SpinWheel = ({ items, onSpinEnd, isColleague = true }) => {
            const [rotation, setRotation] = useState(0);
            const [spinning, setSpinning] = useState(false);
            const [displayName, setDisplayName] = useState('');
            const nameTimerRef = useRef(null);

            const segAngle = 360 / Math.max(items.length, 1);
            const stops = items.map((_, i) => {
                const color = SEGMENT_COLORS[i % SEGMENT_COLORS.length];
                return `${color} ${i * segAngle}deg ${(i + 1) * segAngle}deg`;
            }).join(', ');

            const clearNameTimer = () => {
                if (nameTimerRef.current) {
                    clearTimeout(nameTimerRef.current);
                    nameTimerRef.current = null;
                }
            };

            const handleSpin = () => {
                if (spinning || items.length === 0) return;
                SoundSystem.init();
                setSpinning(true);
                setDisplayName('');

                const targetIndex = Math.floor(Math.random() * items.length);
                const targetItem = items[targetIndex];
                const targetName = isColleague ? targetItem : '';
                const centerAngle = targetIndex * segAngle + segAngle / 2;
                const spins = 6 + Math.floor(Math.random() * 3);
                const deltaBase = (((-(centerAngle + rotation)) % 360) + 360) % 360;
                const totalDelta = deltaBase + spins * 360;
                const newRotation = rotation + totalDelta;
                const duration = 4200;

                SoundSystem.playSpinTicks(duration, items.length);
                SoundSystem.playWhoosh(duration);
                setRotation(newRotation);

                // عرض الأسماء أسفل العجلة فقط للزملاء (يبدأ سريع ثم يبطئ)
                if (isColleague) {
                    clearNameTimer();
                    const startTime = Date.now();
                    let currentDelay = 28;

                    const tickName = () => {
                        const elapsed = Date.now() - startTime;
                        if (elapsed >= duration - 180) {
                            setDisplayName(targetName);
                            return;
                        }
                        const randomItem = items[Math.floor(Math.random() * items.length)];
                        setDisplayName(randomItem);
                        currentDelay = Math.min(currentDelay * 1.085, 280);
                        nameTimerRef.current = setTimeout(tickName, currentDelay);
                    };
                    tickName();
                }

                setTimeout(() => {
                    clearNameTimer();
                    if (isColleague) setDisplayName(targetName);
                    setSpinning(false);
                    SoundSystem.playReveal();
                    onSpinEnd(targetItem, targetIndex);
                }, duration + 60);
            };

            useEffect(() => {
                return () => clearNameTimer();
            }, []);

            return (
                <div className="flex flex-col items-center gap-5">
                    <div className="relative">
                        {/* Pointer */}
                        <div className="absolute left-1/2 -translate-x-1/2 -top-4 xl:-top-5 z-20"
                            style={{ width: 0, height: 0, borderLeft: '18px solid transparent', borderRight: '18px solid transparent', borderTop: '30px solid #1e293b' }}>

                            style={{
                                background: `conic-gradient(${stops})`,
                                transform: `rotate(${rotation}deg)`,
                                transition: spinning ? 'transform 4.2s cubic-bezier(0.12, 0.67, 0.1, 1)' : 'none'
                            }}
                        ></div>
                        {/* Center Hub */}
                        <button
                            onClick={handleSpin}
                            disabled={spinning || items.length === 0}
                            className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 sm:w-24 sm:h-24 xl:w-32 xl:h-32 2xl:w-40 2xl:h-40 rounded-full bg-white border-4 border-brand-primary shadow-xl flex items-center justify-center font-black text-brand-primary text-base sm:text-lg xl:text-2xl 2xl:text-3xl z-10 hover:scale-105 active:scale-95 transition-transform disabled:opacity-70"
                        >
                            {spinning ? <i className="fas fa-circle-notch fa-spin"></i> : 'دور!'}
                        </button>
                    </div>

                    {/* عرض الأسماء المتغيرة أسفل العجلة - للزملاء فقط */}
                    {isColleague && (
                        <div className="name-display w-full max-w-lg xl:max-w-3xl 2xl:max-w-4xl text-center px-4">
                            {displayName ? (
                                <div className="font-black text-brand-primary leading-snug text-xl sm:text-2xl xl:text-3xl 2xl:text-4xl">
                                    {displayName}
                                </div>
                            ) : (
                                <div className="text-slate-300 font-bold text-sm xl:text-base">اضغط دور ليبدأ العرض</div>
                            )}
                        </div>
                    )}

                    <p className="text-slate-400 font-bold text-sm xl:text-lg 2xl:text-xl">{items.length} متبقي في العجلة</p>

        const RevealCard = ({ icon, label, value, buttonLabel, onNext, secondaryLabel, onSecondary, answer, showAnswerBtn }) => {
            const [showAnswer, setShowAnswer] = useState(false);

            return (
                <div className="w-full max-w-xl xl:max-w-3xl 2xl:max-w-4xl mx-auto animate-pop relative">
                    <Confetti />
                    <div className="bg-white p-8 md:p-10 xl:p-14 rounded-[2rem] card-shadow border border-slate-50 relative overflow-hidden text-center">
                        <div className="absolute top-0 right-0 w-28 h-28 bg-brand-light rounded-bl-[4rem] -mr-8 -mt-8 z-0"></div>
                        <div className="absolute bottom-0 left-0 w-20 h-20 bg-brand-light rounded-tr-[3rem] -ml-6 -mb-6 z-0"></div>
                        <div className="relative z-10">
                            <div className="w-14 h-14 xl:w-20 xl:h-20 mx-auto mb-4 xl:mb-6 rounded-full bg-brand-light flex items-center justify-center text-brand-primary text-xl xl:text-3xl">
                                <i className={`fas ${icon}`}></i>
                            </div>
                            <span className="text-xs xl:text-base font-bold text-slate-400 uppercase tracking-wider">{label}</span>
                            <h2 className="text-xl sm:text-2xl md:text-3xl xl:text-4xl 2xl:text-5xl font-black text-slate-800 leading-relaxed mt-3 mb-6 xl:mb-8 px-2">
                                {value}
                            </h2>

                            {/* زر إظهار الإجابة (للأسئلة فقط) */}
                            {showAnswerBtn && answer && (
                                <div className="mb-6">
                                    {!showAnswer ? (
                                        <button
                                            onClick={() => { SoundSystem.playClick(); setShowAnswer(true); }}
                                            className="bg-amber-500 text-white px-6 py-3 xl:px-8 xl:py-4 rounded-xl font-bold text-base xl:text-xl hover:bg-amber-600 active:scale-95 transition-all shadow-md inline-flex items-center gap-2"
                                        >
                                            <i className="fas fa-eye"></i>
                                            <span>إظهار الإجابة</span>
                                        </button>
                                    ) : (
                                        <div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-5 xl:p-6 text-right animate-fade-in">
                                            <div className="text-emerald-700 font-bold text-sm xl:text-base mb-2 flex items-center gap-2 justify-end">
                                                <span>الإجابة</span>
                                                <i className="fas fa-check-circle"></i>
                                            </div>
                                            <p className="text-slate-800 font-bold text-lg xl:text-xl leading-relaxed">{answer}</p>
                                        </div>
                                    )}
                                </div>
                            )}

                            <div className="flex flex-col sm:flex-row items-center justify-center gap-3 xl:gap-4">
                                <button
                                    onClick={() => { SoundSystem.playClick(); onNext(); }}
                                    className="bg-brand-primary text-white px-8 py-4 xl:px-10 xl:py-5 rounded-xl font-bold text-lg xl:text-2xl hover:bg-brand-secondary active:scale-95 transition-all shadow-lg shadow-brand-primary/20 inline-flex items-center gap-3"
                                >
                                    <span>{buttonLabel}</span>
                                    <i className="fas fa-arrow-left"></i>
                                </button>

                                {secondaryLabel && onSecondary && (
                                    <button
                                        onClick={() => { SoundSystem.playClick(); onSecondary(); }}
                                        className="bg-white text-brand-primary border-2 border-brand-primary px-6 py-3.5 xl:px-8 xl:py-4 rounded-xl font-bold text-base xl:text-xl hover:bg-brand-light active:scale-95 transition-all inline-flex items-center gap-2"
                                    >
                                        <i className="fas fa-redo"></i>
                                        <span>{secondaryLabel}</span>
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        /* ================= APP ================= */
        const App = () => {
            const [phase, setPhase] = useState('colleague'); // colleague | reveal-colleague | question | reveal-question
            const [remainingColleagues, setRemainingColleagues] = useState(() => shuffle(ALL_COLLEAGUES));
            const [remainingQuestions, setRemainingQuestions] = useState(() => shuffle(ALL_QUESTIONS));
            const [selectedColleague, setSelectedColleague] = useState(null);
            const [selectedQuestion, setSelectedQuestion] = useState(null);
            const [round, setRound] = useState(1);
            const [notice, setNotice] = useState('');

            const handleColleagueResult = (name, idx) => {
                setSelectedColleague(name);
                setRemainingColleagues(prev => {
                    const next = prev.filter((_, i) => i !== idx);
                    if (next.length === 0) {
                        setNotice('تم استخدام كل الزملاء، هيتم تدوير القائمة من جديد');
                        return shuffle(ALL_COLLEAGUES);
                    }
                    return next;
                });
                setPhase('reveal-colleague');
            };

            const handleQuestionResult = (qObj, idx) => {
                setSelectedQuestion(qObj);
                setRemainingQuestions(prev => {
                    const next = prev.filter((_, i) => i !== idx);
                    if (next.length === 0) {
                        setNotice('تم استخدام كل الأسئلة، هيتم تدوير القائمة من جديد');
                        return shuffle(ALL_QUESTIONS);
                    }
                    return next;
                });
                setPhase('reveal-question');
            };

            const goToQuestionPhase = () => setPhase('question');

            // اختيار زميل آخر (مع استبعاد الحالي لأن remaining أصلاً بدون)
            const chooseAnotherColleague = () => {
                setSelectedColleague(null);
                setNotice('');
                setPhase('colleague');
            };

            // تغيير السؤال (مع استبعاد الحالي)
            const changeQuestion = () => {
                setSelectedQuestion(null);
                setNotice('');
                setPhase('question');
            };

            const newRound = () => {
                setSelectedColleague(null);
                setSelectedQuestion(null);
                setNotice('');
                setRound(r => r + 1);
                setPhase('colleague');
            };

            return (
                <div className="min-h-screen flex flex-col font-tajawal">
                    <Header />

                    <main className="flex-grow w-full max-w-5xl xl:max-w-6xl 2xl:max-w-7xl mx-auto px-4 sm:px-6 flex flex-col items-center justify-center gap-6 xl:gap-10 2xl:gap-12 pb-16">
                        <div className="px-4 py-1.5 xl:px-6 xl:py-2 2xl:px-8 2xl:py-2.5 bg-white rounded-full text-brand-primary font-bold text-sm xl:text-xl 2xl:text-2xl card-shadow border border-brand-light">
                            الجولة {round}
                        </div>

                        {selectedColleague && (phase === 'question' || phase === 'reveal-question') && (
                            <div className="text-slate-500 font-bold text-lg xl:text-2xl 2xl:text-3xl">
                                الزميل: <span className="text-brand-primary">{selectedColleague}</span>
                            </div>
                        )}

                        {notice && (
                            <div className="text-xs xl:text-base font-bold text-amber-600 bg-amber-50 border border-amber-200 px-4 py-2 xl:px-6 xl:py-3 rounded-xl animate-fade-in">
                                <i className="fas fa-info-circle ml-1"></i>{notice}
                            </div>
                        )}

                        {phase === 'colleague' && (
                            <React.Fragment>
                                <h2 className="text-xl md:text-2xl xl:text-4xl 2xl:text-5xl font-bold text-slate-700 text-center">دور العجلة لاختيار زميل 🎯</h2>
                                <SpinWheel items={remainingColleagues} onSpinEnd={handleColleagueResult} isColleague={true} />
                            </React.Fragment>
                        )}

                        {phase === 'reveal-colleague' && (
                            <RevealCard
                                icon="fa-user"
                                label="الزميل"
                                value={selectedColleague}
                                buttonLabel="الأسئلة"
                                onNext={goToQuestionPhase}
                                secondaryLabel="اختر زميل آخر"
                                onSecondary={chooseAnotherColleague}
                            />
                        )}

                        {phase === 'question' && (
                            <React.Fragment>
                                <h2 className="text-xl md:text-2xl xl:text-4xl 2xl:text-5xl font-bold text-slate-700 text-center">دور العجلة لاختيار سؤال عشوائي ❓</h2>
                                <SpinWheel items={remainingQuestions} onSpinEnd={handleQuestionResult} isColleague={false} />
                            </React.Fragment>
                        )}

                        {phase === 'reveal-question' && (
                            <RevealCard
                                icon="fa-circle-question"
                                label="السؤال"
                                value={selectedQuestion?.q}
                                buttonLabel="ابدأ من جديد"
                                onNext={newRound}
                                secondaryLabel="غير السؤال"
                                onSecondary={changeQuestion}
                                answer={selectedQuestion?.a}
                                showAnswerBtn={true}
                            />
                        )}
                    </main>

                    <footer className="text-center py-6 text-slate-400 text-xs font-medium">
                        <p>THE COSMETIC EXPERTS A.A & H.G</p>
                    </footer>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
